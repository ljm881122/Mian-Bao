<style>
  :root{
    box-sizing:border-box;
    --bg:#F5F1E7; --panel:#FFFFFB; --ink:#211E1A; --muted:#6D675D;
    --accent:#B8402E; --tile:#2E5C4E; --gold:#AD8A4E; --border:rgba(33,30,26,.12);
    --shadow:0 1px 2px rgba(33,30,26,.06);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --bg:#151E1A; --panel:#1E2925; --ink:#ECE6D9; --muted:#9FAA9F;
      --accent:#E1604E; --tile:#5A9483; --gold:#C9A05C; --border:rgba(236,230,217,.14);
      --shadow:0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151E1A; --panel:#1E2925; --ink:#ECE6D9; --muted:#9FAA9F;
    --accent:#E1604E; --tile:#5A9483; --gold:#C9A05C; --border:rgba(236,230,217,.14);
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans SC',sans-serif;
    min-height:100%;
  }
  .serif{font-family:'Noto Serif SC',serif;}

  /* ---- fixed language toggle ---- */
  .lang-toggle{
    position:fixed; z-index:20; top:calc(12px + env(safe-area-inset-top,0px)); right:16px;
    background:rgba(28,25,22,.55); color:#FBF7EE; border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    font-family:'Noto Sans SC',sans-serif; font-size:12.5px; font-weight:500; letter-spacing:.03em;
    padding:6px 13px; border-radius:20px; cursor:pointer;
  }

  header.top{
    position:sticky; top:0; z-index:5;
    padding:10px 18px 6px; background:linear-gradient(var(--bg) 85%, transparent);
    display:flex; align-items:center; gap:10px; min-height:26px;
  }
  header.top.hide{display:none;}
  .back-btn{
    display:flex; align-items:center; gap:6px;
    background:none; border:1px solid var(--border); color:var(--muted);
    font-family:'Noto Sans SC',sans-serif; font-size:14px;
    padding:6px 12px 6px 8px; border-radius:20px; cursor:pointer;
    visibility:hidden;
  }
  .back-btn.show{visibility:visible;}
  .crumb{font-size:13px; color:var(--gold); letter-spacing:.02em; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:52px;}
  main{padding:0 20px 60px; max-width:640px; margin:0 auto;}

  .logo-wrap{display:flex; justify-content:center; margin-top:-80px; position:relative; z-index:2;}

    padding:14px 16px; cursor:pointer; box-shadow:var(--shadow);
  }

    flex:none; width:46px; height:46px; border-radius:10px;
    background:var(--tile); color:#FBF7EE;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC',serif; font-size:19px; font-weight:700;
  }
  .station-card .txt{min-width:0;}
  .station-card .txt h2{font-family:'Noto Serif SC',serif; font-size:17px; margin:0 0 4px; font-weight:600;}
  .station-card .txt p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .station-card .n{margin-left:auto; font-size:12.5px; color:var(--muted); flex:none; padding-left:8px; white-space:nowrap;}

  /* ---- Station / dish list ---- */
  .station-head{padding:14px 2px 6px;}
  .station-head h1{font-family:'Noto Serif SC',serif; font-size:24px; margin:0 0 6px;}
  .station-head p{margin:0; color:var(--muted); font-size:14px; line-height:1.7;}
  .dish-list{margin-top:16px; border-top:1px solid var(--border);}
  .dish-row{
    display:flex; align-items:center; gap:12px;
    padding:16px 4px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .dish-row .dot{width:6px; height:6px; border-radius:50%; background:var(--tile); flex:none;}
  .dish-row .name{font-family:'Noto Serif SC',serif; font-size:16.5px; flex:1;}
  .dish-row .arrow{color:var(--muted); font-size:14px;}

  /* ---- Recipe ---- */
  .recipe-head{padding:14px 2px 4px;}
  .recipe-head h1{font-family:'Noto Serif SC',serif; font-size:26px; margin:0;}
  .formula{
    margin-top:18px; background:var(--panel); border:1px solid var(--border);
    border-left:3px solid var(--accent); border-radius:4px; padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .formula .label{font-size:12.5px; color:var(--gold); margin-bottom:8px;}
  .formula .val{font-family:'Noto Serif SC',serif; font-size:16px; line-height:1.8;}
  .video-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:14px;
    color:var(--accent); text-decoration:none; font-size:14px;
    border:1px solid var(--border); border-radius:20px; padding:8px 16px;
  }
  .section-label{margin:26px 0 12px; font-size:12.5px; color:var(--gold);}
  .steps{list-style:none; margin:0; padding:0; counter-reset:step;}
  .steps li{
    counter-increment:step;
    display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--border);
    font-size:15px; line-height:1.7;
  }
  .steps li::before{
    content:counter(step); flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--tile); color:var(--tile);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC',serif; font-size:12.5px; margin-top:1px;
  }
  .note{
    margin-top:20px; padding:14px 16px; background:var(--panel); border:1px dashed var(--border);
    border-radius:4px; font-size:13.5px; color:var(--muted); line-height:1.7;
  }
  .note b{color:var(--ink); font-weight:500;}
  [hidden]{display:none !important;}
</style>
</head>

      <p class="section-tag">${u.selectStation}</p>

        ${DATA.map((st,i)=>`
          <div class="station-card" onclick="openStation(${i})">
            <div class="seal">${st.seal}</div>
            <div class="txt"><h2 class="serif">${st[lang].name}</h2><p>${st[lang].intro}</p></div>
            <div class="n">${u.items(st.dishes.length)}</div>
          </div>`).join('')}
      </div>`;
  }
  else if(s.level==='station'){
    const st = DATA[s.si];
    crumb.textContent = `${u.home} › ${st[lang].name}`;
    view.innerHTML = `
      <div class="station-head">
        <h1 class="serif">${st[lang].name}</h1>
        <p>${st[lang].intro}</p>
      </div>
      <div class="dish-list">
        ${st.dishes.map((d,i)=>`
          <div class="dish-row" onclick="openDish(${s.si},${i})">
            <div class="dot"></div><div class="name">${d[lang].name}</div><div class="arrow">›</div>
          </div>`).join('')}
      </div>`;
  }
  else if(s.level==='dish'){
    const st = DATA[s.si]; const d = st.dishes[s.di];
    crumb.textContent = `${u.home} › ${st[lang].name} › ${d[lang].name}`;
    view.innerHTML = `
      <div class="recipe-head"><h1 class="serif">${d[lang].name}</h1></div>
      <div class="formula">
        <div class="label">${u.ingredients}</div>
        <div class="val">${d[lang].formula}</div>

      <ol class="steps">${d[lang].steps.map(t=>`<li>${t}</li>`).join('')}</ol>
      ${d[lang].note?`<div class="note"><b>${u.note}</b> ${d[lang].note}</div>`:''}

function openStation(i){ stack.push({level:'station', si:i}); render(); }
function openDish(si,di){ stack.push({level:'dish', si, di}); render(); }
function goBack(){ if(stack.length>1){ stack.pop(); render(); } }

render();
